{% set name = "mypy-boto3-textract" %}
{% set version = "1.44.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/mypy_boto3_textract-{{ version }}.tar.gz
  sha256: db0ec1343fc2c3cb20bf6a4277c6a04e04c0bffdf8d45f898259ed196a15dfb4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=60
    - pip
  run:
    - python >={{ python_min }}
    - botocore
    - typing-extensions >=4.1.0

test:
  imports:
    - mypy_boto3_textract
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/youtype/mypy_boto3_builder
  summary: Type annotations for the boto3 Textract service
  doc_url: https://youtype.github.io/boto3_stubs_docs/mypy_boto3_textract/
  dev_url: https://github.com/youtype/mypy_boto3_builder
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mohahf19
